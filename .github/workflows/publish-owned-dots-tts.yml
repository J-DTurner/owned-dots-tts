name: publish-owned-dots-tts

on:
  workflow_dispatch:
  push:
    paths:
      - "infra/tts/Dockerfile"
      - "infra/tts/worker.py"
      - "infra/tts/score.py"
      - "infra/tts/beam_app.py"
      - "infra/tts/requirements.txt"
      - ".github/workflows/publish-owned-dots-tts.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/tts
          file: infra/tts/Dockerfile
          push: true
          tags: ghcr.io/j-dturner/owned-dots-tts:latest
          provenance: false
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH /user/packages/container/owned-dots-tts -f visibility=public
